[package]
name = "uuid47"
description = "A simple and lightweight library for converting between UUIDv7 and UUIDv4 facade."
authors = ["potistudio <potistudio@proton.me>"]
version = "2.0.0"
license = "MIT"
documentation = "https://docs.rs/uuid47"
repository = "https://github.com/potistudio/uuid47-rs"
homepage = "https://github.com/potistudio/uuid47-rs"
keywords = ["uuid", "uuidv4", "uuidv7", "uuidv47", "conversion"]
categories = ["data-structures"]
readme = "README.md"
edition = "2021"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["simd"]
simd = []         # Enable SIMD optimizations (ARM NEON / x86 SSE)
keygen = ["rand"]  # Enable UuidV47Key::random() for key generation

[dependencies]
zeroize = { version = "1", features = ["derive"] }
rand = { version = "0.9", optional = true }

[dev-dependencies]
criterion = "0.5"

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1

[[bench]]
name = "operations"
harness = false
